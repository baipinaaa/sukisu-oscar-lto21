# ============================================================
# ReSukiSU + SUSFS (隐藏 SELinux) 内核构建 — Realme Q5 / 9 5G (oscar, RMX3478)
# ★ LTO 方案 (clang21 + ThinLTO + CFI + LLD) ★
# 平台: SM6375 (holi) | 内核: 5.4 QGKI | LineageOS 23.2
#
# 与 sukisu-oscar (clang14 + GNU ld + workaround patch) 的区别:
#   - 用 clang21 (clang-r563880, 官方 boot.img 版本串同源 21.0.0 based on r563880c)
#   - 用 make LLVM=1 (LD=ld.lld, AR=llvm-ar, NM=llvm-nm 全套 LLVM 工具)
#   - 官方 defconfig 自带的 CONFIG_LTO_CLANG=y + CONFIG_CFI_CLANG=y
#     不再被降级 (之前用 GNU ld 导致 LD_IS_LLD=n -> Kconfig 自动降级
#     LTO_NONE, 这就是 WiFi/蓝牙/音频全挂的根源)
#   - 因此不需要 60_/70_/80_ 三个 workaround patch:
#       * 60_ 跳 CRC  -> 不需要 (LTO 下 struct module 布局与官方一致,
#                         module_layout CRC 自动匹配)
#       * 70_ 假 cfi_slowpath -> 不需要 (CFI_CLANG=y 内核自带真实现)
#       * 80_ 关 PREL32 -> 不需要 (LTO_CLANG=y 时 PREL32 自动 n)
#   - ReSukiSU 原生支持 CFI (.cfi_jt 符号解析, symbol_resolver.c),
#     SUSFS 用 kprobe (官方 CONFIG_KPROBES=y), 兼容 CFI enforcing
#   - 实测参考: Xiaomi Mi Mix 4 (5.4.302) + KSU-Next + SUSFS v1.5.5
#     在 clang LTO + CFI + Shadow Call Stack 下成功编译 (社区实证)
#
# 用法:
#   1. 在 GitHub 新建仓库，把本文件放到 .github/workflows/ 下并 push
#      (patches/50_add_susfs_in_kernel-5.4.patch 必须一起推)
#   2. Actions 页面 → Build SukiSU LTO21 Kernel for oscar → Run workflow
#      (los_date 填你手机当前系统 nightly 的日期，必须一致！)
#      ★ 内核 commit 已随 los_date 同步: 20260921/0914/0907 均对应
#        84e7d691ee3a094de68628c488847a4dd632e7eb (官方 build-manifest 实测)
#        换别的 nightly 日期前, 先用 build-manifest.xml 核对内核 revision!
#   3. 构建完成(约 60-120 分钟, LTO 链接较慢)后下载 artifact: new_boot.img
#   4. fastboot 双槽刷入 (见 README.md)
#
# 已知风险 (详细见 README.md):
#   - clang21 编译 5.4 官方源码: 官方 boot.img 实证可行 (官方即 clang21)
#   - 官方 Werror: 5.4 Makefile KBUILD_CFLAGS += -Werror, clang21 新警告
#     可能触发编译失败 (官方源码已通过, 风险在我们加的 patch)
#   - LTO 编译时间: ThinLTO 链接全内核较慢, 首次构建预计 60-120 分钟
#   - CFI enforcing (官方 # CONFIG_CFI_PERMISSIVE is not set):
#     KSU syscall table hook 需 .cfi_jt 跳板地址 (ReSukiSU 已内置支持)
#
# ★ ReSukiSU ABI 约定 (20260928 修复, 务必先读):
#   20260921 首次用 rc3 构建出的 boot.img 刷入后进 recovery
#   ("Cannot load Android system. Your data may be corrupt")。
#   根因: rc3 的 commit 03b60f2 "kernel: sync with latest susfs" 把
#     ksu_handle_faccessat / ksu_handle_stat 的**调用约定**从
#       (const char __user **filename_user)
#     改成
#       (struct filename **filename)          <- 多解一层,
#     同时删掉了 rc1 里的版本护栏
#       #if LINUX_VERSION_CODE >= KERNEL_VERSION(6,1,0) && defined(CONFIG_KSU_SUSFS)
#     -> 5.4 内核被强制要求新约定; 而我们的 50_ patch 仍传字符串指针,
#        内核把 const char __user ** 当 struct filename ** 解引用 -> oops。
#   修复: patches/50_ 中 fs/open.c / fs/stat.c 的 hook 改为
#     getname_flags() + filename_lookup() 并传 &fname (与官方最新 susfs patch 一致),
#     并顺手修正 fs/read_write.c 的 ksu_handle_sys_read (补全 buf_ptr/count_ptr 两参数)。
#   ★ 以后换 ReSukiSU 版本, 必须看 "校验 ReSukiSU sucompat ABI 约定" 这一步是否通过;
#     若它报错, 说明上游又改了约定, 50_ patch 需要同步 (反之亦然)。
#
# ★ 内核版本串必须等于 realme 官方值 (20260928 修复, 见「强制 UTS_RELEASE」步骤):
#   目标: UTS_RELEASE = 5.4.254-qgki-g11b1ffb570a8
#   背景: Duck Detector 的 kernelcheck 检测项会把「所有能读到内核 release 的
#     表面」收集起来互相比对, 其中
#       System.getProperty("os.version")   <- zygote 启动时从 uname() 取的真值快照
#     是**不可修改**的系统属性 (fork 后每个 App 都继承), 而 SUSFS set_uname 是
#     hook uname() syscall 且在 post-fs-data 阶段才生效 —— **晚于 zygote**, 所以
#     快照里存的始终是内核真实版本。真实版本 != 伪装值 -> Divergent -> DANGER。
#   根治: 让内核自己的版本号就等于官方值。两个表面天然一致, 不需要 set_uname,
#     也不需要 bind mount 那三个 proc 文件 (app 域本来就读不到它们)。
#   ★ 注意旧写法踩过的坑: 之前用 `./scripts/config ... --set-str CONFIG_LOCALVERSION "..." || true`,
#     末尾的 `|| true` 会把「前面某个符号不存在导致的非 0 退出」一起吞掉, 于是
#     同一条命令里排在后面的 --set-str 根本没执行 -> 版本串退化成 5.4.254-<scm 后缀>。
# ============================================================
name: Build SukiSU LTO21 Kernel for oscar

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支 (默认 lineage-23.2，对应你刷的 LineageOS 23.2)'
        required: true
        type: string
        default: 'lineage-23.2'
      los_version:
        description: 'LineageOS 版本 (用于 nightly 下载链接)'
        required: true
        type: string
        default: '23.2'
      los_date:
        description: 'LineageOS nightly 日期 YYYYMMDD (必须与你手机当前系统一致!)'
        required: true
        type: string
        default: '20260921'
      custom_version:
        description: '【已废弃·请留空】版本串现固定为官方值 5.4.254-qgki-g11b1ffb570a8，填了也会被「强制 UTS_RELEASE」步骤覆盖'
        required: false
        type: string
        default: ''
      enable_cfi:
        description: '开启 CFI (默认 true=官方 enforcing; false=仅 LTO 不开 CFI)'
        required: true
        type: boolean
        default: true
      resukisu_ref:
        description: 'ReSukiSU 版本钉扎 (commit SHA / tag)。默认 fa8311f6 = v4.2.0-rc3，其 sucompat ABI 已由 patches/50_ 适配；填 latest 用最新版（ABI 可能又变，构建时会校验）'
        required: false
        type: string
        default: 'fa8311f632a215b5381ec644627c6198d1e8a13e'

env:
  DEVICE: 'oscar'
  CLANG_VER: 'clang-r563880'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ============ 0. 检出本仓库 (含 patches/ 下的 SUSFS patch) ============
      - name: 检出仓库
        uses: actions/checkout@v4

      # ============ 1. 内核源码 (缓存) ============
      - name: 恢复内核源码缓存
        id: cache-kernel
        uses: actions/cache/restore@v6
        with:
          path: kernel
          # ★ v3: 固定到官方 commit 84e7d691ee3a (20260921/0914/0907 nightly 官方内核)
          #   旧缓存 c8c87694a044 是 2026-01-27 的树, 与官方差 1090 个 commit,
          #   导致 module_layout 等 23 个符号 CRC 差异, 必须失效
          key: kernel-oscar-lto21-${{ github.event.inputs.kernel_branch }}-84e7d691ee3a-v3

      - name: 下载 oscar 内核源码 (LineageOS, 固定官方 commit 84e7d691ee3a)
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          # ★ 必须 checkout 到官方 nightly 对应的 commit 84e7d691ee3a:
          #   20260921 / 20260914 / 20260907 三份 build-manifest.xml 均写
          #     LineageOS/android_kernel_realme_sm6375 revision="84e7d691ee3a094de68628c488847a4dd632e7eb"
          #   (= lineage-23.2 分支 HEAD, 2026-08-22 "arm64: configs:
          #    Regenerate Q/GKI holi defconfigs")
          #   旧值 c8c87694a044 (2026-01-27) 与官方差 1090 个 commit, 导致
          #   module_layout 等 23 个符号 CRC 与官方 vendor 模块不一致
          #   (8-17 时期实测: HEAD vs 官方树 .symtypes diff 4~20 行)
          git clone --depth 1 --branch "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/LineageOS/android_kernel_realme_sm6375 kernel
          cd kernel
          git fetch origin 84e7d691ee3a094de68628c488847a4dd632e7eb --depth=1
          git checkout 84e7d691ee3a094de68628c488847a4dd632e7eb
          echo "内核 commit: $(git rev-parse HEAD)"
          echo "内核分支: ${{ github.event.inputs.kernel_branch }}"
          ls arch/arm64/configs/vendor/ | grep holi

      - name: 保存内核源码缓存
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: kernel
          key: kernel-oscar-lto21-${{ github.event.inputs.kernel_branch }}-84e7d691ee3a-v3

      # ============ 2. 编译依赖 ============
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc flex bison bc cpio lz4 xz-utils \
            libssl-dev libncurses-dev libelf-dev device-tree-compiler \
            ccache zip unzip
          # LLVM=1 模式不需要 binutils-aarch64-linux-gnu (ld.lld/llvm-ar 全在 clang 里)

      # ============ 3. AOSP Clang 21 (缓存) ============
      # clang-r563880 = clang 21.0.0 based on r563880 (官方 oscar boot.img
      #   版本串完全一致: "Android (14054515, +pgo, +bolt, +lto, +mlgo, based
      #   on r563880c) clang version 21.0.0"; 官方是 Google 内部 c 变体,
      #   公开 prebuilt 为 r563880)
      # ★ 重要: clang-r563880 只在 android16-qpr1-release 分支, main/master
      #   分支没有! (main 只有 r547379=clang20 / r584948=clang22)
      - name: 恢复 AOSP Clang 21 缓存
        id: cache-clang
        uses: actions/cache/restore@v6
        with:
          path: clang
          key: clang-oscar-lto21-${{ env.CLANG_VER }}-v2

      - name: 下载 AOSP Clang 21 (android16-qpr1-release 分支 + sparse)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -e
          # sparse + blob:none 只下载需要的 clang 版本目录 (~1.5GB)
          # ★ 必须指定 --branch android16-qpr1-release (clang-r563880 只在这)
          git clone --depth 1 --filter=blob:none --sparse --branch android16-qpr1-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          cd clang
          git sparse-checkout set clang-r563880
          # ★ 严格验证 (不能用管道掩盖失败; 缺任一工具立即报错退出)
          test -x clang-r563880/bin/clang || { echo "!! clang 缺失, sparse checkout 失败"; exit 1; }
          clang-r563880/bin/clang --version | head -1
          for t in ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-readelf llvm-size; do
            test -x clang-r563880/bin/$t && echo "OK $t" || { echo "!! $t 缺失 (LLVM=1 必需)"; exit 1; }
          done

      - name: 保存 AOSP Clang 21 缓存
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: clang
          key: clang-oscar-lto21-${{ env.CLANG_VER }}-v2

      # ============ 4. ReSukiSU 集成 (全量 clone) ============
      # ReSukiSU = SukiSU-Ultra 的独立重构 fork (GPL-3.0)。
      # Kbuild 强制要求 KernelSU 目录是 git 仓库 (rev-list 计数版本号) +
      # 内核树根有 .git —— 因此 ReSukiSU 必须完整 clone (不能 --depth 1)。
      # ★ CFI 兼容: ReSukiSU 原生支持 CFI 内核 (.cfi_jt 符号解析,
      #   infra/symbol_resolver.c; __nocfi 宏标记被 hook 的函数)。
      - name: 集成 ReSukiSU (全量 clone + symlink)
        run: |
          cd kernel
          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          cd KernelSU
          # ★ 版本钉扎: 默认 fa8311f6 = v4.2.0-rc3。
          #   rc3 在 20260921 无法启动的根因已在 patches/50_ 中修好 (见文件头注释):
          #   rc3 commit 03b60f2 把 ksu_handle_faccessat / ksu_handle_stat 的调用约定
          #   由 (const char __user **) 改成 (struct filename **) 并删掉了 >=6.1.0 护栏。
          #   保留全量历史以便 checkout 任意 commit; resukisu_ref=latest 则用默认分支最新提交。
          #   ★ 换版本后 ABI 校验步骤 (下一步) 会挡住不匹配的组合。
          REF="${{ github.event.inputs.resukisu_ref }}"
          if [ -n "$REF" ] && [ "$REF" != "latest" ]; then
            git checkout "$REF"
          fi
          echo "ReSukiSU commit : $(git log --oneline -1)"
          echo "ReSukiSU date   : $(git log -1 --format=%cd --date=short)"
          echo "ReSukiSU commit#: $(git rev-list --count HEAD)"
          ls kernel/Kbuild kernel/Kconfig kernel/selinux/selinux.c && echo "结构正确 (kernel/ 目录)"
          cd ..
          ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          echo "--- 检查 ReSukiSU 源码是否集成 ---"
          ls -la drivers/kernelsu/ | head -8
          grep -n "kernelsu" drivers/Makefile

      # ============ 4.2 校验 ReSukiSU sucompat ABI 约定与 50_ patch 一致 ============
      # ★ 这一步是最重要的保险丝。rc3 曾把 ksu_handle_faccessat / ksu_handle_stat
      #   的调用约定从 (const char __user **) 静默改成 (struct filename **),
      #   编译器检查不出来 (声明与调用点都在我们自己的 50_ patch 里, 自洽),
      #   结果是内核每次 faccessat/stat 都 oops -> 刷入后直接进 recovery。
      #   这里在编译前把约定钉死, 让不匹配的版本组合**构建失败**而不是刷出一个坏 boot。
      - name: 校验 ReSukiSU sucompat ABI 约定
        run: |
          cd kernel/KernelSU
          fail=0
          chk() { # $1=文件  $2=ERE  $3=说明
            if grep -qE "$2" "$1"; then
              echo "OK   $3  [$1]"
            else
              echo "!!   $3  [$1] 未找到: $2"
              fail=1
            fi
          }
          # SUSFS 分支的声明必须出现在最前面 (= CONFIG_KSU_SUSFS 选中的那一个)
          HEAD_DECL=$(grep -n 'int ksu_handle_faccessat(int \*dfd,' kernel/feature/sucompat.h | head -1)
          echo "sucompat.h 首个 ksu_handle_faccessat 声明:"
          echo "  $HEAD_DECL"
          if echo "$HEAD_DECL" | grep -q 'struct filename \*\*filename'; then
            echo "OK   sucompat.h 首个声明是 struct filename ** (rc3 约定)"
          else
            echo "!!   sucompat.h 首个声明不是 struct filename ** -> 与 50_ patch 不匹配"
            fail=1
          fi
          chk kernel/feature/sucompat.h  'int ksu_handle_stat\(int \*dfd, struct filename \*\*filename, int \*flags\);'                            'sucompat.h  ksu_handle_stat 新约定'
          chk kernel/feature/sucompat.c  'int ksu_handle_faccessat\(int \*dfd, struct filename \*\*filename, int \*mode, int \*__unused_flags\)'     'sucompat.c  ksu_handle_faccessat 实现'
          chk kernel/feature/sucompat.c  'int ksu_handle_stat\(int \*dfd, struct filename \*\*filename, int \*flags\)'                                   'sucompat.c  ksu_handle_stat 实现'
          chk kernel/feature/sucompat.c  'int ksu_handle_execveat_sucompat\(int \*fd, struct filename \*\*filename_ptr'                                    'sucompat.c  ksu_handle_execveat_sucompat'
          chk kernel/runtime/ksud_integration.c 'int ksu_handle_sys_read\(unsigned int fd, char __user \*\*buf_ptr, size_t \*count_ptr\)'               'ksud_integration.c ksu_handle_sys_read 三参数'
          chk kernel/runtime/ksud_integration.c 'int ksu_handle_input_handle_event\(unsigned int \*type, unsigned int \*code, int \*value\)'            'ksud_integration.c ksu_handle_input_handle_event'
          if [ "$fail" != 0 ]; then
            echo "!! ReSukiSU 与 patches/50_add_susfs_in_kernel-5.4.patch 的 ABI 约定不匹配, 终止构建"
            echo "!! 请对照 fs/open.c / fs/stat.c / fs/read_write.c 的 hook 决定改哪边"
            exit 1
          fi
          echo "sucompat ABI 校验通过 (ReSukiSU 侧)"

      # ============ 4.4 应用 selinux_hide access 探测过滤 patch (ReSukiSU) ============
      # 在 my_write_access() 里过滤含 fsck_untrusted / su / adbroot 的 access 查询,
      # 命中直接返回 -EINVAL, 避免 root 检测工具通过 /sys/fs/selinux/access 探测
      # fake policy 中的敏感域信息。目标文件属 ReSukiSU 仓库, 故在 KernelSU 目录内 apply。
      - name: 应用 selinux_hide access 过滤 patch
        run: |
          cd kernel/KernelSU
          patch -p1 < ../../patches/55_add_selinux_hide_access_filter.patch
          echo "--- 验证过滤已集成 ---"
          grep -n "fsck_untrusted" kernel/feature/selinux_hide.c

      # ============ 4.5 应用 SUSFS 5.4 patch (fs/ 层, 隐藏 SELinux 核心) ============
      # 官方 SUSFS v2.2.0 只有 GKI 5.10 patch。oscar 是高通 5.4 QGKI ——
      # 本仓库已移植为 5.4 版本 (patches/50_add_susfs_in_kernel-5.4.patch)。
      # SUSFS 用 kprobe (pts_unix98_lookup_kp 等), 官方 CONFIG_KPROBES=y,
      # kprobe 子系统与 CFI 兼容 (CFI 只校验间接调用, kprobe 是直接指令替换)。
      - name: 应用 SUSFS 5.4 patch
        run: |
          cd kernel
          patch -p1 < ../patches/50_add_susfs_in_kernel-5.4.patch
          echo "--- 验证 SUSFS 已集成 ---"
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          grep -n "susfs" fs/Makefile
          grep -c "CONFIG_KSU_SUSFS" fs/namei.c
          # ★ ABI: 调用点必须传 struct filename ** (与 ReSukiSU rc3 的 CONFIG_KSU_SUSFS 分支一致),
          #   否则内核会把 const char __user ** 当 struct filename ** 解引用 -> oops 进 recovery
          echo "--- 验证 sucompat 调用点 ABI (新约定) ---"
          grep -n "ksu_handle_faccessat(int \*dfd, struct filename \*\*filename" fs/open.c
          grep -n "ksu_handle_faccessat(&dfd, &fname, &mode, NULL)" fs/open.c
          grep -n "filename_lookup(dfd, fname, lookup_flags, &path, NULL)" fs/open.c
          grep -n "ksu_handle_stat(int \*dfd, struct filename \*\*filename" fs/stat.c
          grep -n "ksu_handle_stat(&dfd, &fname, &flags)" fs/stat.c
          grep -n "ksu_handle_sys_read(fd, &buf, &count)" fs/read_write.c
          # ★ 确认内核确实提供 filename_lookup()。它在本树里是**全局函数**,
          #   但只声明在 fs/internal.h (fs/ 私有头), 不在 include/linux/namei.h。
          #   50_ patch 采用的方案是「fs/stat.c 已 include 不了它 就在文件内自补 extern 声明」;
          #   若换内核树后这里 grep 不到, 说明 API 变了, 必须重新适配 (否则报
          #   implicit declaration of function 'filename_lookup' 而中断编译)。
          echo "--- 确认内核提供 filename_lookup (5.4 未在 namei.h 暴露) ---"
          grep -n "^extern int filename_lookup" fs/internal.h
          grep -n "^int filename_lookup(int dfd, struct filename \*name, unsigned flags," fs/namei.c
          # fs/open.c 需要它自己 include "internal.h" 才能拿到声明 (fs/stat.c 靠自补 extern)
          grep -n '^#include "internal.h"' fs/open.c
          echo "sucompat ABI 校验通过 (内核侧)"

      # ============ 4.6 可选: CFI 关闭时提供假 __cfi_slowpath ============
      # 仅当 enable_cfi=false (关闭 CFI) 时应用: 官方 vendor 模块是 CFI 编译的,
      # 引用 __cfi_slowpath; 关闭 CFI 后内核无此符号 -> 模块被拒。提供假实现
      # 放行 (模块自带 __cfi_check 原样运行)。CFI 开启 (默认) 时内核自带真
      # 实现, 此 patch 绝不能用 (重复定义冲突)。
      - name: 应用 __cfi_slowpath 兼容 patch (仅 CFI 关闭时)
        if: ${{ github.event.inputs.enable_cfi == 'false' }}
        run: |
          cd kernel
          patch -p1 < ../patches/70_add_cfi_slowpath.patch
          echo "--- 验证 cfi patch 已应用 ---"
          grep -n "__cfi_slowpath" kernel/module.c

      # ============ 5. 修复高通 trace include (clang 兼容) ============
      - name: 修复高通 TRACE_INCLUDE_PATH (clang 兼容)
        run: |
          cd kernel
          # 高通 trace.h 的 TRACE_INCLUDE_PATH 用相对路径 (如 "." / "../..")，
          # define_trace.h 展开成 #include "<路径>/<FILE>.h"——clang 不搜索
          # "主源文件所在目录"，相对路径全部解析不到。统一改为相对内核根的
          # 目录路径 + 纯文件名 (语义等价)。
          grep -rln --exclude-dir=.git "#define TRACE_INCLUDE_PATH" \
            --include="*.h" . 2>/dev/null | while read f; do
            if grep -qE "^#define TRACE_INCLUDE_PATH \.\.?(/.*)?$" "$f"; then
              dir=$(dirname "$f" | sed 's|^\./||')
              [ "$dir" = "." ] && dir=""
              file=$(grep -m1 "^#define TRACE_INCLUDE_FILE" "$f" | sed 's|.*#define TRACE_INCLUDE_FILE *||; s| *$||')
              base=$(basename "$file")
              sed -i "s|^#define TRACE_INCLUDE_PATH .*|#define TRACE_INCLUDE_PATH $dir|" "$f"
              sed -i "s|^#define TRACE_INCLUDE_FILE .*|#define TRACE_INCLUDE_FILE $base|" "$f"
              echo "patched: $f  (PATH=$dir FILE=$base)"
            else
              echo "skip:    $f (PATH 已是根相对路径)"
            fi
          done
          echo "--- 验证 ---"
          grep -n "TRACE_INCLUDE" kernel/sched/walt/trace.h
          grep -n "TRACE_INCLUDE" techpack/camera/drivers/cam_utils/cam_trace.h

      # ============ 5.5 修复 tcpc inc/ 相对 include (clang 兼容) ============
      - name: 修复 tcpc inc/ include (clang 兼容)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          f = 'drivers/usb/typec/tcpc/inc/pd_dpm_pdo_select.h'
          s = open(f, encoding='utf-8').read()
          old = '#include "inc/tcpci.h"'
          assert old in s, 'pattern not found in ' + f
          open(f, 'w', encoding='utf-8').write(s.replace(old, '#include "tcpci.h"', 1))
          print('tcpc inc/ include fixed')
          PYEOF
          grep -n 'include .tcpci' drivers/usb/typec/tcpc/inc/pd_dpm_pdo_select.h

      # ============ 5.6 修复 oplus_project section mismatch (modpost FATAL) ============
      - name: 修复 oplus_project section mismatch (modpost)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(fname, pairs):
              s = open(fname, encoding='utf-8').read()
              for old, new in pairs:
                  assert old in s, 'PATCH FAIL %s: %r' % (fname, old[:60])
                  s = s.replace(old, new, 1)
              open(fname, 'w', encoding='utf-8').write(s)
              print('OK', fname)

          for f in ['drivers/soc/oplus/system/oplus_project/qcom/oplus_project.c',
                    'drivers/soc/oplus/system/oplus_project/gki/oplus_project.c']:
              s = open(f, encoding='utf-8').read()
              if 'parent_1, struct proc_dir_entry *parent_2' in s:
                  pairs = [
                      ('static void update_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)',
                       'static void __init update_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)'),
                      ('static void update_telephony_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)',
                       'static void __init update_telephony_manifest(struct proc_dir_entry *parent_1, struct proc_dir_entry *parent_2)'),
                  ]
              else:
                  pairs = [
                      ('static void update_manifest(struct proc_dir_entry *parent)',
                       'static void __init update_manifest(struct proc_dir_entry *parent)'),
                      ('static void update_telephony_manifest(struct proc_dir_entry *parent)',
                       'static void __init update_telephony_manifest(struct proc_dir_entry *parent)'),
                  ]
              patch(f, pairs)
          PYEOF
          grep -rn '__init update_manifest\|__init update_telephony' drivers/soc/oplus/system/oplus_project/

      # ============ 6. 配置 + 编译 (LLVM=1 全套) ============
      # ★★★ 本方案核心: make LLVM=1 → LD=ld.lld + AR=llvm-ar + NM=llvm-nm
      #   → LD_IS_LLD=y → CONFIG_LTO_CLANG=y / CONFIG_CFI_CLANG=y 生效
      #   (官方 defconfig 自带这两个 =y, 之前用 GNU ld 被 Kconfig 降级!)
      - name: 恢复 ccache
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-oscar-lto21-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-oscar-lto21-${{ github.event.inputs.kernel_branch }}-

      - name: 配置内核 (LLVM=1 + holi-qgki defconfig + SukiSU 开关)
        run: |
          cd kernel
          export PATH=$PWD/../clang/${{ env.CLANG_VER }}/bin:$PATH
          # ★ LOCALVERSION= 空值 (必须!): CONFIG_LOCALVERSION_AUTO=n 时
          #   scripts/setlocalversion 若发现 LOCALVERSION 环境变量未设置 且 仓库
          #   不在 annotated tag 上 (GitHub 浅克隆必然) -> 自动追加 '+'
          #   -> UTS_RELEASE/vermagic 变 5.4.302-qgki-g84e7d691ee3a+ 与官方
          #   模块 (84e7d691ee3a 无+) 不匹配, check_vermagic 拒绝所有 vendor 模块
          #   (实测: wifi/蓝牙/音频全挂, run 32489911904)。空值即可 (${LOCALVERSION+set}=set)
          export LOCALVERSION=
          # LLVM=1: 全套 LLVM 工具链 (clang + ld.lld + llvm-ar + llvm-nm + llvm-strip)
          make LLVM=1 ARCH=arm64 KCFLAGS='-I. -Idrivers/usb/typec/tcpc' vendor/holi-qgki_defconfig
          # ★ LineageOS 官方 oscar 构建 = holi-qgki_defconfig + debugfs.config 合并
          ./scripts/config -d DEBUG_FS -d PAGE_OWNER
          # 开启 ReSukiSU + SUSFS 全部 9 个子开关
          ./scripts/config -e KSU -e KALLSYMS -e KALLSYMS_ALL \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -d KSU_TRACEPOINT_HOOK \
            -d CONFIG_LOCALVERSION_AUTO
          # ★ 这里刻意**不加** `|| true`: scripts/config 遇到不存在的符号会以非 0
          #   退出, 一旦被吞掉, 同一条命令里后面的操作就不会执行 (老代码就是因此
          #   丢掉了 CONFIG_LOCALVERSION 的设置)。
          #   版本串统一在 olddefconfig 之后用 sed 强制写入 (见下一段)。
          # CFI 开关 (默认开=官方 enforcing; false=仅 LTO)
          if [ "${{ github.event.inputs.enable_cfi }}" = "true" ]; then
            ./scripts/config -e CFI_CLANG -e CFI_CLANG_SHADOW
            echo "CFI: 开启 (官方 enforcing 模式)"
          else
            ./scripts/config -d CFI_CLANG -d CFI_CLANG_SHADOW
            echo "CFI: 关闭 (仅 LTO, 保留官方 __cfi_slowpath 引用由 70_ patch 兜底)"
          fi
          make LLVM=1 ARCH=arm64 \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc -DKSU_COMPAT_HAS_SELINUX_STATE' olddefconfig

          # ============ 6.1 ★★ 强制 UTS_RELEASE == realme 官方内核版本串 ============
          # 目标: uname -r / /proc/version / 内核内嵌 "Linux version ..." 全部等于
          #         5.4.254-qgki-g11b1ffb570a8
          #
          # 为什么必须 (2026-09-28 Duck Detector 报告驱动):
          #   kernelcheck 会把 System.getProperty("os.version") (zygote 启动时从
          #   uname() 取的真值快照, 不可修改, 被所有 App 继承) 与 uname() syscall
          #   的返回值互相比对。SUSFS set_uname 晚于 zygote, 所以快照里是真实版本,
          #   与伪装值不等 -> KERNEL_IDENTITY_CONSISTENCY Divergent -> DANGER。
          #   只要内核真实版本 == 官方值, 两个表面天然一致, 无需任何伪装。
          #
          # 三个措施缺一不可:
          #   1) 清空 EXTRAVERSION      -> KERNELVERSION 保持纯净的 5.4.254
          #   2) .scmversion 建为空文件 -> scripts/setlocalversion 的 scm_version()
          #      第一件事就是 `cat .scmversion` 后 return, 于是 git 描述 (-g<hash>),
          #      '+', '-dirty' 全都不会出现 (GitHub 浅克隆必然不是 tagged commit)
          #   3) 直接 sed 写 .config 的 CONFIG_LOCALVERSION -> 不依赖 scripts/config
          # ★ 关键: LineageOS 的 oscar 内核源码树是 5.4.302, 而设备实际使用的
          #   realme 官方 (prebuilt) 内核是 5.4.254。SUBLEVEL 也参与 UTS_RELEASE
          #   与 vermagic 计算, 所以必须一并拉回 254 —— 只改 LOCALVERSION 不够。
          #   两个版本间只差 stable 补丁, 302 是 254 的超集, ABI 兼容
          #   (本 workflow 的 40 符号 CRC 校验就是在该树上通过官方值校验的)。
          #
          # 四个措施缺一不可:
          #   1) SUBLEVEL = 254         -> base 对齐官方
          #   2) EXTRAVERSION 清空      -> 不留多余连字符
          #   3) .scmversion 建为空文件 -> scripts/setlocalversion 的 scm_version()
          #      第一件事就是 `cat .scmversion` 后 return, 于是 git 描述 (-g<hash>),
          #      '+', '-dirty' 全都不会出现 (GitHub 浅克隆必然不是 tagged commit)
          #   4) 直接 sed 写 .config 的 CONFIG_LOCALVERSION -> 不依赖 scripts/config 是否成功
          WANT_VER="5.4.254-qgki-g11b1ffb570a8"
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 254/' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          touch .scmversion
          # localversion* 文件会经 collect_files 直接拼进版本串, 必须清掉
          rm -f localversion* 2>/dev/null || true
          if grep -q '^CONFIG_LOCALVERSION=' .config; then
            sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${WANT_VER}\"|" .config
          else
            echo "CONFIG_LOCALVERSION=\"${WANT_VER}\"" >> .config
          fi
          echo "--- 强制版本串后自检 ---"
          grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile
          grep -n '^CONFIG_LOCALVERSION' .config
          grep -n '^CONFIG_LOCALVERSION_AUTO' .config || echo "OK: CONFIG_LOCALVERSION_AUTO 未启用"
          make LLVM=1 ARCH=arm64 \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc -DKSU_COMPAT_HAS_SELINUX_STATE' prepare \
            >/dev/null 2>&1 || true
          echo "kernelrelease = $(cat include/config/kernel.release 2>/dev/null || echo '(未生成)')"
          echo "--- 配置验证 ---"
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS|CONFIG_LOCALVERSION|CONFIG_DEBUG_FS|CONFIG_PAGE_OWNER|CONFIG_MODVERSIONS" .config \
            || echo "!! 未找到 KSU/SUSFS 配置，请检查 ReSukiSU 集成是否成功"
          echo "--- LTO/CFI 验证 (本方案核心!) ---"
          grep -E "CONFIG_LTO|CONFIG_CFI|CONFIG_THINLTO|CONFIG_LD_IS_LLD|CONFIG_CC_IS_CLANG" .config
          echo "--- PREL32 验证 (LTO 下应自动为 n) ---"
          grep "HAVE_ARCH_PREL32" .config \
            && echo "!! PREL32 仍开启 (LTO 未生效?)" \
            || echo "OK: PREL32 已关闭 (LTO_CLANG=y 自动)"

      - name: 编译内核 (LLVM=1 + ccache 加速)
        run: |
          cd kernel
          export PATH=$PWD/../clang/${{ env.CLANG_VER }}/bin:$PATH
          # ★ LOCALVERSION= 空值 (必须!): include/config/kernel.release 带 FORCE
          #   每次编译都会重新生成, 若此步骤不设 LOCALVERSION 则 '+' 又会被
          #   追加回去 -> vermagic 再错。与配置步骤保持一致。
          export LOCALVERSION=
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 4G
          # LLVM=1: 全套 LLVM 工具链
          # KCFLAGS=-I. 让内核根进入 include 搜索链 (高通相对 include 必需)
          # -DKSU_COMPAT_HAS_SELINUX_STATE: 5.4 高通 selinux_state 无 GKI 字段,
          # 该宏触发 ReSukiSU selinux.c 的 5.4 兼容分支 (selinux_hide fake_state)
          # ThinLTO 链接较慢 (ld.lld --thinlto-cache-dir=.thinlto-cache)
          make LLVM=1 ARCH=arm64 CC="ccache clang" \
            KCFLAGS='-I. -Idrivers/usb/typec/tcpc -DKSU_COMPAT_HAS_SELINUX_STATE' -j$(nproc)
          ls -la arch/arm64/boot/Image
          echo "--- 内核版本 ---"
          VER=$(strings arch/arm64/boot/Image | grep -m1 "Linux version")
          echo "$VER"
          # ★ 版本串验证: 必须与官方完全一致 (无 '+') 否则 vermagic 不匹配
          #   官方模块全被拒 (wifi/蓝牙/音频全挂, run 32489911904 教训)
          # ★ 版本串验证: 必须**精确包含** realme 官方内核 release。
          #   1) vermagic 一致 -> 官方 vendor 模块 (CFI 编译) 才肯加载。带 '+' 或
          #      hash 后缀时 dmesg 报 version magic mismatch, wifi/蓝牙/音频全挂
          #      (run 32489911904 教训)
          #   2) Duck Detector kernelcheck 会把 os.version (zygote 快照) 与 uname()
          #      互相比对 —— 内核真实版本 == 官方值时两个表面天然一致, 否则报
          #      KERNEL_IDENTITY_CONSISTENCY Divergent -> DANGER
          WANT_VER="5.4.254-qgki-g11b1ffb570a8"
          if ! echo "$VER" | grep -qF "$WANT_VER"; then
            echo "!! 内核版本串不含官方值 '$WANT_VER'"
            echo "!! -> vermagic 不匹配 + os.version/uname 不一致, 构建失败"
            echo "!! 实际版本串: $VER"
            exit 1
          fi
          echo "OK: 内核版本串 == 官方值 $WANT_VER"
          # ★★★ Module.symvers CRC 校验 (run 32489911904 教训):
          #   dmesg 报 'disagrees about version of symbol module_layout'——
          #   vendor 模块 (CFI 编译) 的 __versions CRC 与官方内核一致,
          #   我们的 LTO21 内核 module_layout/bus_register/driver_register 等
          #   23 个符号 CRC 不匹配 (涉及 struct module/device/kmem_cache/of 的
          #   展开差异)。这里直接用 Module.symvers 对照官方值 (取自
          #   vendor swr_dlkm.ko __versions + 官方 boot.img __kcrctab 反查)。
          # ★ 2026-09-24 更新: 官方内核换到 84e7d691ee3a (20260921 nightly),
          #   40 个符号中 17 个未变、23 个已变 (根因: 8-22 commit
          #   "arm64: configs: Regenerate Q/GKI holi defconfigs" 改了
          #   holi-qgki_defconfig -> struct 展开变化)。
          #   新值从 20260921 官方 boot.img 的 __kcrctab 反查:
          #     vaddr = 0xffffffc010080000 + file_off;
          #     同一符号满足 6*Y - P = const (P=__ksymtab 项地址, Y=__kcrctab 项地址),
          #     17 个旧值命中锚点定出 const = 0xb74cb30, 再由 const 解出 23 个
          #     MISS 符号的新 Y 位置读 CRC;
          #     交叉验证: 40/40 项的 __ksymtab value 字段均为合法 vaddr;
          #     且算出的 module_layout=0x32aa09e1 与 8-17 时期 HEAD 树实测值吻合。
          #   module_layout 不匹配立即失败。
          python3 - <<'PYEOF'
          import sys
          EXPECTED = {
              '__cfi_slowpath': '0x2cd90edd', '__devm_regmap_init': '0xf813045f',
              '__kmalloc': '0xeb233a45', '__list_add_valid': '0x68f31cbd',
              '__list_del_entry_valid': '0xe1537255', '__mutex_init': '0x977f511b',
              '__regmap_init': '0xc2cfe3d6', '__stack_chk_fail': '0xf0fdf6cb',
              '__stack_chk_guard': '0x8f678b07', '_dev_err': '0xf58b10d2',
              'bus_register': '0x16fd06ab', 'bus_unregister': '0x6025f0e2',
              'dev_get_regmap': '0x2ef6d2f9', 'dev_set_name': '0x40ab455d',
              'device_for_each_child': '0x0543f71d', 'device_register': '0x4c8a95b7',
              'device_unregister': '0x98be9da8', 'driver_register': '0xd83b86f9',
              'driver_unregister': '0xacfc56f9', 'get_device': '0x9f76c44c',
              'idr_alloc': '0xb8f11603', 'idr_find': '0x20978fb9',
              'idr_remove': '0x7665a95b', 'kfree': '0x037a0cba',
              'kmalloc_caches': '0x41bdb885', 'kmem_cache_alloc_trace': '0x3d9902e6',
              'krealloc': '0xb1e12d81', 'module_layout': '0x32aa09e1',
              'mutex_lock': '0x2ab7989d', 'mutex_unlock': '0x409bcb62',
              'of_alias_get_id': '0x43aadc47', 'of_get_next_available_child': '0xe6ba705e',
              'of_modalias_node': '0xf993cc8e', 'of_property_read_u64': '0x37dfa3a3',
              'pm_generic_resume': '0xdc98fa9e', 'pm_generic_suspend': '0xad5ff920',
              'printk': '0xc5850110', 'put_device': '0x23e50e24',
              'strcmp': '0xe2d5255a', 'strlcpy': '0x5792f848',
          }
          crcs = {}
          for line in open('Module.symvers', encoding='utf-8', errors='replace'):
              p = line.split()
              if len(p) >= 2 and p[0].startswith('0x'):
                  crcs[p[1]] = p[0]
          ok, bad = 0, []
          for sym, want in EXPECTED.items():
              got = crcs.get(sym)
              if got == want:
                  ok += 1
              else:
                  bad.append((sym, want, got))
          print(f'CRC 校验: {ok}/{len(EXPECTED)} 通过')
          for sym, want, got in bad:
              print(f'  MISS {sym}: 期望 {want} 实际 {got}')
          if any(s == 'module_layout' for s, _, _ in bad):
              print('!! module_layout CRC 不匹配 (vendor 模块拒载: disagreements about version of symbol module_layout)')
              sys.exit(1)
          print('OK: module_layout CRC 与官方/vendor 一致 (其余 MISS 符号仅告警, 见上方列表)')
          PYEOF

      # ============ 6.5 genksyms 双树诊断 (仅在前面步骤失败时运行) ============
      # ★ 背景: 8-17 时期官方 Image (c8c87694a044 树) 的 module_layout=0x392bc26a,
      #   而我们当时用 lineage-23.2 HEAD 树实测 0x32aa09e1 —— 由此做了本诊断:
      #   官方 commit 纯树 + 我们的 .config + 我们的 clang21, 重跑 module.o 等
      #   4 个文件的 genksyms (KBUILD_SYMTYPES=1 生成 .symtypes) 对比:
      #     - 官方纯树也得到同一值 -> 官方 Image 含本地修改(非纯树) -> 走 CRC 强制覆盖方案
      #     - 官方纯树得到官方值     -> 树/config 差异 -> diff .symtypes 直接定位差异 token
      # ★ 2026-09-24: 官方内核已改用 84e7d691ee3a (= lineage-23.2 HEAD, 2026-08-22
      #   "arm64: configs: Regenerate Q/GKI holi defconfigs"), 我们 checkout 的就是
      #   官方树, "树不一致" 这一根因已消除; 且官方 Image 的 module_layout 现在是
      #   0x32aa09e1 (与旧 HEAD 树实测值一致, 已由 20260921 官方 boot.img 反查确认)。
      #   因此本诊断不再每次运行 (原 if: always() 每次白下载 200-300MB tarball +
      #   双份编译), 改为仅在前面步骤失败时运行, 保留定位能力。
      - name: genksyms 双树诊断 (HEAD vs 官方commit 84e7d691ee3a)
        if: failure()
        run: |
          set -x
          export PATH=$GITHUB_WORKSPACE/clang/${{ env.CLANG_VER }}/bin:$PATH
          export LOCALVERSION=
          export KCFLAGS='-I. -Idrivers/usb/typec/tcpc -DKSU_COMPAT_HAS_SELINUX_STATE'
          mkdir -p $GITHUB_WORKSPACE/diag
          cd $GITHUB_WORKSPACE/kernel

          # ==== [9a] 当前树(HEAD) dump: 4 个关键文件的 .symtypes ====
          echo "===== [9a] HEAD 树 .symtypes ====="
          for f in kernel/module kernel/printk/printk mm/slab_common drivers/base/core; do
            rm -f $f.o $f.symtypes
            make LLVM=1 ARCH=arm64 KBUILD_SYMTYPES=1 KCFLAGS="$KCFLAGS" $f.o 2>&1 | tail -2
            [ -f $f.symtypes ] && cp $f.symtypes /tmp/head_$(basename $f).symtypes && echo "OK head $f.symtypes"
          done
          echo "--- HEAD Module.symvers module_layout ---"
          grep "module_layout" Module.symvers

          # ==== [9b] 官方 commit 对照树 ====
          # ★ 根治方案: 不拉 git 历史 (浅克隆 fetch 特定 sha / shallow-since /
          #   unshallow 在 GitHub 上不可靠), 直接用 GitHub archive tarball
          #   下载官方 commit 完整树 (runner 在 GitHub 内网, github.com 必通)
          OFF_SHA=84e7d691ee3a094de68628c488847a4dd632e7eb
          echo "===== [9b] 官方 commit $OFF_SHA 对照树 ====="
          SKIP_OFF=0
          rm -rf /tmp/otree && mkdir -p /tmp/otree
          echo "下载官方 commit tarball (约 200-300MB, 1-3 分钟)..."
          if curl -sL --retry 3 -o /tmp/off.tar.gz \
              "https://github.com/LineageOS/android_kernel_realme_sm6375/archive/$OFF_SHA.tar.gz"; then
            echo "tarball 下载完成: $(stat -c%s /tmp/off.tar.gz) bytes"
            tar -xzf /tmp/off.tar.gz -C /tmp/otree --strip-components=1 2>&1 | tail -2
          else
            echo "!! tarball 下载失败 (curl exit $?)"
            SKIP_OFF=1
          fi
          if [ -f /tmp/otree/Makefile ]; then
            echo "官方树就绪 (Makefile 存在)"
            cd /tmp/otree
          else
            echo "!! 官方树不可用, 跳过 [9b] 对照"
            SKIP_OFF=1
          fi
          if [ "$SKIP_OFF" = "0" ]; then
            cp $GITHUB_WORKSPACE/kernel/.config .config
            make LLVM=1 ARCH=arm64 olddefconfig 2>&1 | tail -1
            make LLVM=1 ARCH=arm64 prepare 2>&1 | tail -2
            for f in kernel/module kernel/printk/printk mm/slab_common drivers/base/core; do
              rm -f $f.o $f.symtypes
              make LLVM=1 ARCH=arm64 KBUILD_SYMTYPES=1 KCFLAGS="$KCFLAGS" $f.o 2>&1 | tail -2
              [ -f $f.symtypes ] && cp $f.symtypes /tmp/off_$(basename $f).symtypes && echo "OK off $f.symtypes"
            done
            echo "--- 官方commit树 module.symtypes 的 struct module 定义行 ---"
            grep -E "^s#module " /tmp/off_module.symtypes 2>/dev/null | head -c 400
            echo
          fi
          cd $GITHUB_WORKSPACE/kernel

          # ==== [9c] diff 对比 ====
          echo "===== [9c] .symtypes diff (HEAD vs 官方commit) ====="
          for f in module printk slab_common core; do
            if [ -f /tmp/head_$f.symtypes ] && [ -f /tmp/off_$f.symtypes ]; then
              echo "--- $f.symtypes ---"
              diff /tmp/head_$f.symtypes /tmp/off_$f.symtypes > /tmp/diff_$f.txt 2>&1 || true
              echo "  diff 行数: $(wc -l < /tmp/diff_$f.txt)"
              head -40 /tmp/diff_$f.txt
            fi
          done

          # ==== [9d] 结论 ====
          # 判定依据: .symtypes = genksyms 展开前 token 列表, 两树相同 ->
          # 递归展开必相同 -> CRC 必相同。因此不用 worktree 的 Module.symvers
          # (未全量构建不存在), 直接以 module.symtypes 的 diff 行数判定。
          echo "===== [9d] 结论 ====="
          if [ "$SKIP_OFF" = "1" ]; then
            echo "判定: 官方树不可用 (fetch/worktree 失败) -> 无对照数据, 检查上方日志"
          else
            D=$(wc -l < /tmp/diff_module.txt 2>/dev/null || echo 9999)
            echo "module.symtypes diff 行数: $D (官方Image module_layout=0x32aa09e1)"
            if [ "$D" = "0" ]; then
              echo "判定: HEAD == 官方纯树 (checkout 已生效, 构建树 == 官方 Image 树)"
              echo "      -> 若上方 CRC 校验仍失败, 则官方 Image 含本地修改(非纯 84e7d691ee3a)"
              echo "      -> 走 CRC 强制覆盖方案 (改 genksyms 对 MISS 符号输出固定 CRC)"
            else
              echo "判定: 仍有树差异 -> 看上方 diff 定位修复"
            fi
          fi
          cp -f /tmp/head_*.symtypes /tmp/off_*.symtypes /tmp/diff_*.txt $GITHUB_WORKSPACE/diag/ 2>/dev/null || true
          echo "诊断产物已保存到 diag/"
          echo "===== 诊断完成 ====="

      # ============ 6. 原版 boot.img (缓存) ============
      - name: 恢复原版 boot.img 缓存
        id: cache-boot
        uses: actions/cache/restore@v6
        with:
          path: boot.img
          key: boot-oscar-${{ github.event.inputs.los_date }}

      - name: 从 LineageOS nightly 获取原版 boot.img (直链或 payload 提取)
        if: steps.cache-boot.outputs.cache-hit != 'true'
        run: |
          set -e
          EXPECT_SHA=""
          if curl -s --max-time 20 "https://download.lineageos.org/api/v2/devices/${DEVICE}/builds" -o los_builds.json; then
          EXPECT_SHA=$(python3 -c "
          import json
          d = json.load(open('los_builds.json'))
          date = '${{ github.event.inputs.los_date }}'
          for b in d:
              if b.get('date','').replace('-','') == date:
                  for f in b.get('files',[]):
                      if f.get('filename') == 'boot.img':
                          print(f.get('sha256',''))
          ")
            rm -f los_builds.json
            echo "官方 API 返回 boot.img sha256: $EXPECT_SHA"
          else
            echo "官方 API 不可用, 跳过 sha256 校验"
          fi
          for BOOT_URL in \
            "https://mirrorbits.lineageos.org/full/${DEVICE}/${{ github.event.inputs.los_date }}/boot.img" \
            "https://mirror.freedif.org/lineageos/full/${DEVICE}/${{ github.event.inputs.los_date }}/boot.img"; do
            echo "尝试直链: $BOOT_URL"
            HTTP=$(curl -sL -o boot.img -w '%{http_code}' --retry 3 "$BOOT_URL" || echo 000)
            if [ "$HTTP" = "200" ] && [ -s boot.img ]; then
              echo "直链下载成功: $(stat -c%s boot.img) bytes"
              break
            fi
            rm -f boot.img
          done
          if [ -s boot.img ]; then
            echo "boot.img 就绪 (直链)"
          else
            echo "直链均不可用, 改用 payload.bin 提取"
            LOS_URL="https://mirrorbits.lineageos.org/full/${DEVICE}/${{ github.event.inputs.los_date }}/lineage-${{ github.event.inputs.los_version }}-${{ github.event.inputs.los_date }}-nightly-${DEVICE}-signed.zip"
            echo "下载: $LOS_URL"
            curl -sL --retry 3 -o los.zip "$LOS_URL"
            unzip -o los.zip payload.bin
            rm -f los.zip
            if [ ! -x ./payload-dumper-go ]; then
              PDG_URL=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest | python3 -c "import json,sys;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d['assets'] if 'linux_amd64' in a['name']][0])")
              echo "下载 payload-dumper-go: $PDG_URL"
              curl -sL -o pdg.tar.gz "$PDG_URL"
              tar -xzf pdg.tar.gz
              rm -f pdg.tar.gz
            fi
            ./payload-dumper-go -o . -p boot payload.bin
            rm -f payload.bin
            ls -la boot.img
          fi
          python3 -c "
          with open('boot.img','rb') as f:
              magic = f.read(8)
          assert magic == b'ANDROID!', 'boot.img magic 校验失败: %r' % magic
          print('boot.img magic OK')
          "
          if [ -n "$EXPECT_SHA" ]; then
            ACTUAL_SHA=$(sha256sum boot.img | cut -d' ' -f1)
            echo "实际 sha256: $ACTUAL_SHA"
            if [ "$ACTUAL_SHA" != "$EXPECT_SHA" ]; then
              echo "!! sha256 不匹配: 期望 $EXPECT_SHA"
              exit 1
            fi
            echo "sha256 校验通过"
          fi
          test -s boot.img
          echo "boot.img 就绪"

      - name: 保存原版 boot.img 缓存
        if: steps.cache-boot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: boot.img
          key: boot-oscar-${{ github.event.inputs.los_date }}

      # ============ 7. 打包 + 上传 ============
      - name: 解包原 boot + 打包 new_boot.img
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          python3 mkbootimg/unpack_bootimg.py --boot_img boot.img --out boot_split
          ls boot_split/
          # ⚠️ 关键修复(2026-09-27)：Realme RMX3478 的 bootloader 只接受 header_version=3。
          # 原先 `HDR_VER=$(cat boot_split/header_version || echo "4")` 的兜底默认值 "4"
          # 使产物变成 v4，刷入后进 recovery 报
          # "Cannot load Android system. Your data may be corrupt"。
          # 官方 boot.img(LineageOS nightly) 实测就是 header_version=3。
          # 改为直接从原 boot.img 二进制读 header 字段，不依赖 unpack_bootimg.py 的文本输出文件。
          read -r HDR_VER OS_VER OS_PATCH <<< "$(python3 -c "import struct;d=open('boot.img','rb').read();ov=struct.unpack('<I',d[16:20])[0];print(struct.unpack('<I',d[40:44])[0], '%d.%d.%d'%((ov>>25)&0x7f,(ov>>18)&0x7f,(ov>>11)&0x7f), '%04d-%02d'%(2000+((ov>>4)&0x7f),ov&0xf))")"
          echo "os_version=$OS_VER os_patch=$OS_PATCH header=$HDR_VER"
          if [ "$HDR_VER" != "3" ]; then
            echo "::error::原 boot.img header_version=$HDR_VER (预期 3)，中止"
            exit 1
          fi
          python3 mkbootimg/mkbootimg.py \
            --kernel kernel/arch/arm64/boot/Image \
            --ramdisk boot_split/ramdisk \
            --cmdline "$(cat boot_split/cmdline)" \
            --header_version $HDR_VER \
            --os_version "$OS_VER" --os_patch_level "$OS_PATCH" \
            -o new_boot.img
          # 填充到原 boot.img 的完整大小(= boot 分区大小 160MB)。
          # 官方 boot.img 本身就是完整分区镜像，尾部是零填充 + AVB footer；
          # 只写 45MB 会在分区尾部残留上次刷入的旧 AVB footer/旧数据，干扰引导。
          python3 -c "import os;t=os.path.getsize('boot.img');d=open('new_boot.img','rb').read();open('new_boot.img','wb').write(d+b'\x00'*(t-len(d))) if len(d)<t else None;print('new_boot.img ->', os.path.getsize('new_boot.img'), 'bytes (target', t, ')')"
          echo "=== 打包完成 ==="
          ls -la new_boot.img

      - name: 验证产物
        run: |
          python3 mkbootimg/unpack_bootimg.py --boot_img new_boot.img --out new_split
          echo "原 boot 内核大小: $(stat -c%s boot_split/kernel)"
          echo "新 boot 内核大小: $(stat -c%s new_split/kernel)"
          # ⚠️ 必须校验 header_version=3，否则刷入会进 recovery
          python3 -c "import struct;d=open('new_boot.img','rb').read();hv=struct.unpack('<I',d[40:44])[0];print('new_boot.img header_version:',hv);print('new_boot.img size:',len(d));assert hv==3,'header_version must be 3, got %d'%hv;print('OK: header_version check passed')"
          echo "new_boot.img MD5: $(md5sum new_boot.img)"
          sha256sum new_boot.img > SHA256SUMS.txt

      - name: 保存 ccache (构建成功才更新，供下次加速)
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-oscar-lto21-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}

      - name: 上传产物
        if: always()   # ★ 构建失败也要上传 diag/ (诊断 .symtypes) 供分析
        uses: actions/upload-artifact@v4
        with:
          name: oscar-sukisu-lto21-${{ github.event.inputs.los_date }}-new_boot
          path: |
            new_boot.img
            SHA256SUMS.txt
            kernel/arch/arm64/boot/Image
            kernel/.config
            kernel/Module.symvers
            diag/*
          if-no-files-found: warn
